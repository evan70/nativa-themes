<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Modules as horizontal slices over one runtime">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <rect width="720" height="360" fill="url(#sky)" />

  <!-- one runtime, seven slices: the modular-monolith shape -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <g fill="#1e293b" stroke="#334155">
      <rect x="40" y="44" width="640" height="30" rx="6" />
      <rect x="40" y="86" width="640" height="30" rx="6" />
      <rect x="40" y="128" width="640" height="30" rx="6" />
      <rect x="40" y="170" width="640" height="30" rx="6" />
      <rect x="40" y="212" width="640" height="30" rx="6" />
      <rect x="40" y="254" width="640" height="30" rx="6" />
      <rect x="40" y="296" width="640" height="26" rx="6" />
    </g>

    <g fill="#94a3b8">
      <text x="58" y="63">Core</text>
      <text x="58" y="105">Database</text>
      <text x="58" y="147">Users</text>
      <text x="58" y="189">Blog</text>
      <text x="58" y="231">Media</text>
      <text x="58" y="273">Locales</text>
      <text x="58" y="313" fill="#60a5fa">Themes</text>
    </g>

    <g fill="#475569">
      <text x="300" y="63">Kernel + middleware</text>
      <text x="300" y="105">users.db · config.db</text>
      <text x="300" y="147">auth · RBAC</text>
      <text x="300" y="189">markdown · FTS5</text>
      <text x="300" y="231">uploads</text>
      <text x="300" y="273">sk · en</text>
      <text x="300" y="313" fill="#2563eb">starter · erik · moonshine</text>
    </g>
  </g>

  <!-- the one-way edge: modules may know themes, never the reverse -->
  <path d="M40 334h640" stroke="url(#edge)" stroke-width="2" fill="none" />
  <g fill="#60a5fa" font-family="ui-monospace, monospace" font-size="11">
    <circle cx="360" cy="334" r="4" />
    <text x="374" y="338">Modules &#8594; Themes</text>
  </g>
</svg>
